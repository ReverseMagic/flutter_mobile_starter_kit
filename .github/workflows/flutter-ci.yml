name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Confirm pinned toolchain
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Format Dart sources
        run: dart format lib/app lib/core lib/features lib/main.dart test

      - name: Require committed formatting on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- lib/app lib/core lib/features lib/main.dart test

      - name: Inspect analyzer configuration
        run: cat analysis_options.yaml

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Commit formatter changes on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib/app lib/core lib/features lib/main.dart test analysis_options.yaml pubspec.lock
          if git diff --cached --quiet; then
            echo "No formatter or analyzer configuration changes to commit."
          else
            git commit -m "style: apply Dart formatting and analyzer updates"
            git push
          fi
